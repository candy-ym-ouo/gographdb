<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoGraphDB</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>GoGraphDB</h1><span id="status">连接中</span></div><nav><button id="refresh">刷新</button><button id="save">保存快照</button><button id="rebuild">重建索引</button></nav></header><main><section class="canvas-card"><canvas id="graph"></canvas><div id="empty">创建节点后，图会显示在这里</div></section><aside><section><h2>图统计</h2><div id="stats" class="stats"></div></section><section><h2>创建节点</h2><form id="vertex-form"><input name="labels" placeholder="标签，如 Person"><textarea name="properties" placeholder='属性 JSON，如 {"name":"张三"}'>{}</textarea><button>创建节点</button></form></section><section><h2>创建边</h2><form id="edge-form"><div class="row"><input name="from" type="number" min="1" placeholder="起点 ID"><input name="to" type="number" min="1" placeholder="终点 ID"></div><input name="label" placeholder="边标签，如 FRIEND"><textarea name="properties" placeholder='属性 JSON，如 {"weight":1}'>{}</textarea><button>创建边</button></form></section><section><h2>选中元素</h2><pre id="selected">点击画布中的节点</pre></section></aside><section class="console"><h2>GQL 查询</h2><textarea id="query">MATCH (n:Person) RETURN n.id, n.name LIMIT 20</textarea><button id="run">执行</button><pre id="result">等待执行</pre></section></main><div id="toast"></div><script src="/app.js"></script></body></html>
